<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3on3 Freestyle プレイスタイル2軸診断</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0f0f0f] text-white font-sans p-4 md:p-8">

<div class="max-w-3xl mx-auto bg-white/5 border border-white/10 rounded-2xl p-6 md:p-10 shadow-2xl">
    <h1 class="text-3xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-yellow-500 mb-4 tracking-tighter">
        3on3 Freestyle PLAYSTYLE DIAGNOSIS
    </h1>
    <p class="text-gray-400 mb-8">20問の質問に答えて、あなたのスタイルを診断しよう。</p>

    <form id="diagnosisForm">
        <h2 class="text-xl font-black italic text-orange-500 border-b-2 border-orange-500 pb-2 mb-6">X軸：エンジョイ ↔ ガチ</h2>
        <div id="q1-10"></div>

        <h2 class="text-xl font-black italic text-cyan-500 border-b-2 border-cyan-500 pb-2 mb-6 mt-12">Y軸：感覚 ↔ 分析</h2>
        <div id="q11-20"></div>

        <button type="button" onclick="calc()" class="w-full mt-10 bg-orange-600 hover:bg-orange-500 py-4 rounded-xl font-black text-xl italic">診断結果を表示</button>
    </form>

    <div id="resultBox" class="hidden mt-10 p-6 bg-black/50 border border-orange-500/50 rounded-xl text-center">
        <div id="typeResult" class="text-3xl font-black mb-4"></div>
        <div class="flex justify-center gap-10">
            <div><p class="text-xs text-gray-400">ガチ度</p><span id="gachiScore" class="text-2xl font-black text-orange-500"></span></div>
            <div><p class="text-xs text-gray-400">分析度</p><span id="bunsekiScore" class="text-2xl font-black text-cyan-500"></span></div>
        </div>
    </div>
</div>

<script>
const questions = [
    {id:1, txt:"勝つための最適行動を常に考えてプレイする"}, {id:2, txt:"負け試合が続くと、プレイ内容をすぐに見直す"},
    {id:3, txt:"強い編成やメタキャラを優先して使う"}, {id:4, txt:"ボイスチャット等で連携を密にとる"},
    {id:5, txt:"練習モードでスキルやシュートタイミングを繰り返す"}, {id:6, TXT:"野良より固定PTでランク戦に挑むことが多い"},
    {id:7, txt:"対戦相手の動きを毎回観察している"}, {id:8, txt:"負けると悔しくて、すぐ次の試合に行きたくなる"},
    {id:9, txt:"自分のスタッツ（成績）を常に意識している"}, {id:10, txt:"上位プレイヤーのプレイ動画をよく参考にする"},
    {id:11, txt:"新キャラが出たら、まずステータスやバフを細かく調べる"}, {id:12, txt:"キャラごとの有利・不利な相性をメモしている"},
    {id:13, txt:"シュート成功率やブロック判定などの仕様を言語化できる"}, {id:14, txt:"カード厳選の際、数値を計算して最適化する"},
    {id:15, txt:"相手の動きの癖やパターンを分析して対策する"}, {id:16, txt:"P-BUFFの組み合わせを何度も試行錯誤する"},
    {id:17, txt:"自分のミスを論理的に反省できる"}, {id:18, txt:"キャラの立ち回りや spacing を理論で説明できる"},
    {id:19, txt:"試合中に状況の変化（相手の守備など）を冷静に判断する"}, {id:20, txt:"直感より確実なデータや情報を信じる"}
];

function createForm() {
    questions.forEach(q => {
        const html = `
        <div class="mb-6 p-4 bg-black/40 rounded-lg border border-white/5">
            <p class="font-bold mb-3">Q${q.id}. ${q.txt}</p>
            <div class="flex justify-between px-2 text-xs text-gray-500 font-bold mb-1"><span>全く思わない</span><span>とてもそう思う</span></div>
            <div class="flex justify-between gap-2">
                ${[1,2,3,4,5].map(v => `<label class="flex-1 text-center cursor-pointer"><input type="radio" name="q${q.id}" value="${v}"></label>`).join('')}
            </div>
        </div>`;
        document.getElementById(q.id <= 10 ? 'q1-10' : 'q11-20').insertAdjacentHTML('beforeend', html);
    });
}

function calc() {
    let gSum = 0, bSum = 0;
    for(let i=1; i<=20; i++){
        const v = document.querySelector(`input[name="q${i}"]:checked`);
        if(!v) { alert("未回答があります"); return; }
        if(i <= 10) gSum += Number(v.value); else bSum += Number(v.value);
    }
    const g = gSum/10, b = bSum/10;
    const type = (g >= 3.5 ? (b >= 3.5 ? "司令塔 (ガチ × 分析)" : "点取り屋 (ガチ × 感覚)") : (b >= 3.5 ? "サポーター (エンジョイ × 分析)" : "ムードメーカー (エンジョイ × 感覚)"));
    
    document.getElementById("typeResult").innerText = type;
    document.getElementById("gachiScore").innerText = g.toFixed(1);
    document.getElementById("bunsekiScore").innerText = b.toFixed(1);
    document.getElementById("resultBox").classList.remove("hidden");
    window.scrollTo({top: document.getElementById("resultBox").offsetTop, behavior: 'smooth'});
}

createForm();
</script>
</body>
</html>
